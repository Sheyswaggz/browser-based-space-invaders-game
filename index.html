<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Classic Space Invaders arcade game built with HTML5 Canvas. Defend Earth from alien invaders in this browser-based retro gaming experience.">
    <meta name="keywords" content="space invaders, arcade game, html5 game, browser game, retro gaming">
    <meta name="author" content="Space Invaders Game">
    
    <!-- Mobile Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Space Invaders">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    
    <!-- Open Graph Meta Tags for Social Sharing -->
    <meta property="og:title" content="Space Invaders - Browser Game">
    <meta property="og:description" content="Classic Space Invaders arcade game built with HTML5 Canvas">
    <meta property="og:type" content="website">
    
    <title>Space Invaders</title>
    
    <!-- Preload Critical Resources -->
    <link rel="preload" href="styles.css" as="style">
    <link rel="preload" href="src/main.js" as="script">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- NoScript Fallback -->
    <noscript>
        <div class="noscript-message">
            <h1>JavaScript Required</h1>
            <p>This game requires JavaScript to run. Please enable JavaScript in your browser settings and reload the page.</p>
        </div>
    </noscript>

    <!-- Game Container -->
    <div class="game-container">
        <!-- Header -->
        <header class="game-header">
            <h1 class="game-title">Space Invaders</h1>
            <div class="game-info">
                <span class="score-display" id="scoreDisplay" aria-live="polite">Score: 0</span>
                <span class="lives-display" id="livesDisplay" aria-live="polite">Lives: 3</span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-main">
            <canvas 
                id="gameCanvas" 
                role="img" 
                aria-label="Space Invaders game canvas"
                tabindex="0">
                Your browser does not support the HTML5 canvas element required to play this game.
            </canvas>
            
            <!-- Game Status Messages -->
            <div class="game-status" id="gameStatus" aria-live="assertive" aria-atomic="true"></div>
        </main>

        <!-- Footer with Controls -->
        <footer class="game-footer">
            <div class="controls-info">
                <h2 class="controls-title">Controls</h2>
                <div class="controls-grid">
                    <div class="control-item">
                        <kbd>←</kbd> <kbd>→</kbd>
                        <span>Move</span>
                    </div>
                    <div class="control-item">
                        <kbd>Space</kbd>
                        <span>Fire</span>
                    </div>
                    <div class="control-item">
                        <kbd>P</kbd>
                        <span>Pause</span>
                    </div>
                    <div class="control-item">
                        <kbd>R</kbd>
                        <span>Restart</span>
                    </div>
                </div>
                <p class="mobile-controls">
                    <strong>Mobile:</strong> Tap left/right to move, tap center to fire
                </p>
            </div>
            
            <div class="footer-links">
                <a href="https://github.com/yourusername/space-invaders-game" target="_blank" rel="noopener noreferrer">
                    View Source
                </a>
                <span class="separator">|</span>
                <span class="version">v0.1.0</span>
            </div>
        </footer>
    </div>

    <!-- Main Game Module -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
